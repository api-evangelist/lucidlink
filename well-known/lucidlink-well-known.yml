summary: >-
  LucidLink serves no /.well-known document on any host it controls. Every path below was
  probed and every one missed. Two results need reading carefully rather than counting.
  app.lucidlink.com answers HTTP 200 with the same 2,573-byte single-page-app HTML shell
  for EVERY /.well-known path (and for /openapi.json, /llms.txt and anything else) — that
  is an SPA catch-all, not a served document, and it is recorded as a miss. And
  status.lucidlink.com does serve a real /.well-known/security.txt, but it is Atlassian
  Statuspage's own file (Contact: https://www.atlassian.com/...), published by Atlassian
  for the hosting platform, not by LucidLink — so it is recorded here and deliberately not
  credited to LucidLink or given a SecurityTxt pointer.

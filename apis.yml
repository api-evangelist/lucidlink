apis:
- name: LucidLink Management API
  description: >-
    The self-hosted administrative REST API for the new LucidLink platform, delivered as the lucidlink/lucidlink-api
    Docker image and run on customer infrastructure so that LucidLink's zero-knowledge model is preserved.
    Covers members, groups, permissions, filespaces, directory entries, direct links, storage providers
    and health. Auth is a service-account secret key sent as an Authorization Bearer token. Interactive
    Swagger documentation is generated and served by the container itself at /api/v1/docs, so the OpenAPI
    document is only reachable once the container is running on the customer host.
  humanURL: https://support.lucidlink.com/hc/en-us/articles/40221355571725-LucidLink-API-Overview
  baseURL: http://{api-container-host}:3003/api/v1
  tags:
  - Members
  - Groups
  - Permissions
  - Filespaces
  - Directories
  properties:
  - type: Documentation
    url: >-
      https://support.lucidlink.com/hc/en-us/articles/40235274774797-API-Key-Functionalities-Common-Automation-Scenarios
  - type: GettingStarted
    url: >-
      https://support.lucidlink.com/hc/en-us/articles/40221700126605-Deployment-Usage-LucidLink-API-Container
- name: LucidLink Web Service API v2
  description: >-
    The LucidLink-hosted workspace web service used by the LucidLink apps and by the admin tool surface
    of the official LucidLink MCP server. Exposes service accounts, workspaces, members, groups, filespaces
    and member roles under /api/v2. Authenticated with a service-account bearer token; LucidLink publishes
    no standalone reference for it, so the endpoint inventory recorded here was read from LucidLink's
    own published lucidlink-mcp package and confirmed against live 401 responses.
  humanURL: https://www.lucidlink.com/developer-platform
  baseURL: https://api.lucidlink.com/api/v2
  tags:
  - Workspaces
  - Members
  - Groups
  - Service Accounts

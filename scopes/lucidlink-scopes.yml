finding: >-
  LucidLink declares an OAuth2 client-credentials flow with an EMPTY scopes map and applies
  it globally. There is no way for a client to request less than everything: one credential
  reaches domain creation and deletion, filespace creation and deletion, and billing —
  including PATCH /billing/payment, which overwrites the payment instrument on the account.
  For an agent-mediated integration that is the sharpest edge on this API.
partial_mitigation:
  name: Collaborator Service Accounts (beta)
  since: build 3.7.8584 (2026-08-08)
  detail: >-
    Scopes automation to specific folders and filespaces rather than to full admin. It
    applies to the service-account bearer model on the Management API, not to the OAuth2
    credentials on the public Service API, and it is API-only with no UI in beta.
  docs: https://support.lucidlink.com/hc/en-us/articles/48014583746573-Collaborator-Service-Accounts-Beta

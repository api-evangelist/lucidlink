notes: >-
  The `--rest-endpoint ip:port` global option is worth flagging: the local daemon exposes
  its own REST service, and the CLI is a client of it. That is a fourth HTTP surface,
  entirely undocumented as an API, and it is the mechanism the Python SDK and the MCP server
  ultimately reach the filespace through.

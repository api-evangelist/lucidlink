name: lucid
binary: lucid
description: >-
  `lucid` is LucidLink's first-party command-line client, shipped inside the desktop client
  package for Windows, macOS and Linux. It is not a wrapper over the REST APIs — it drives
  the local LucidLink daemon that mounts and streams the filespace, so its surface is
  mount/cache/lock/snapshot rather than members and billing. It is also the only published
  interface for several operations (cache tuning, prefetcher control, pinning, S3/Azure
  rekey, metastore, fscheck).

  detail: Installed with the LucidLink desktop client from https://www.lucidlink.com/download
- method: command-line download
  detail: LucidLink documents a headless/scripted client download for server installs
  docs: https://support.lucidlink.com/hc/en-us/articles/31125482780941-Command-line-download-LucidLink-client
usage: 'lucid [general options] command [options]'

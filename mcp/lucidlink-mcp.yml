method: searched
source: https://www.lucidlink.com/mcp-server and https://pypi.org/project/lucidlink-mcp/ (wheel lucidlink_mcp-0.3.0-py3-none-any.whl,
  fetched 2026-08-25)
name: LucidLink MCP Server
status: beta
version: 0.3.0
vendor: LucidLink Corp.
description: 'Official LucidLink MCP server (beta). Gives MCP-compatible agents a shared, persistent

  LucidLink filespace they can read, write, search, lock and audit — the "shared data

  layer for agentic AI" LucidLink markets at lucidlink.com/mcp-server. It is a local

  stdio server: the MCP client launches it with uvx and no LucidLink-hosted MCP endpoint

  exists. An optional --http streamable-HTTP transport binds loopback only and is the

  operator''s own to expose (reverse proxy or the companion

  lucidlink-mcp-cloudflared tunnel package); that is self-hosting, not a vendor-hosted

  remote server.'
deployment:
  mode: local-stdio
  install: uvx lucidlink-mcp@latest
  package: https://pypi.org/project/lucidlink-mcp/
  auth: api-key
  verified: searched
  auth_detail: LucidLink service-account token (documented prefix sa_live:), configured with `uvx --from
    lucidlink-mcp lucidlink-mcp-setup`. Minted by a workspace admin; Business or Enterprise plan required.
  client_registration:
    claude_code: claude mcp add lucidlink -s user -- uvx lucidlink-mcp@latest
    codex: codex mcp add lucidlink -- uvx lucidlink-mcp@latest
    cursor: '{"mcpServers":{"lucidlink":{"command":"uvx","args":["lucidlink-mcp@latest"]}}}'
  prerequisites:
  - uv / uvx on PATH
  - Python >= 3.10 (uv supplies it)
  - Node.js 22+ on PATH — only for the admin toolset; file tools do not need it
  remote_endpoint: null
  remote_note: None published. `lucidlink-mcp --http` serves streamable HTTP but binds a loopback port
    behind a generated secret path segment with DNS-rebinding protection, and its own module docstring
    says "exposing it is the operator's pipe".
safety_controls:
- control: read-only mode
  detail: LUCIDLINK_MCP_READ_ONLY env var or readOnly config key; HTTP mode defaults to read-only tools.
- control: dangerous-action confirmation
  detail: Destructive or dangerous operations are flagged for explicit client confirmation.
- control: MCP tool annotations
  detail: Every tool carries a read_only / additive / destructive / stateful annotation, recorded per
    tool below.
- control: client-side rate limiting
  detail: rateLimit config key caps calls per fixed window inside the server process.
- control: no desktop mount required
  detail: Agents reach the filespace through the SDK, not a decrypted mounted drive.
- control: audit trail
  detail: read_audit_trail / subscribe_changes read NDJSON audit events under .lucid_audit/ when an admin
    has enabled audit.
- control: path canonicalization
  detail: '@canonicalize_paths normalizes every path argument before the tool body runs.'
toolsets:
- filesystem
- editing
- discovery
- search
- locking
- connect
- audit
- stats
- identity
- change-feed
- admin
tool_count: 47
tool_extraction_note: 'A live tools/list could not be run anonymously: this server is stdio-only and refuses

  to start without a service-account token, so there is no anonymous endpoint to POST

  jsonrpc tools/list at. The tool list below was extracted statically from LucidLink''s

  own published wheel (lucidlink_mcp/tools/*.py, @mcp.tool decorators) by AST parse —

  names, titles, behaviour annotations, parameters, types and defaults are verbatim from

  the provider''s shipped source. The `admin` toolset (whoami_admin, workspace_summary_admin

  and the rest of lucidlink_mcp/tools/admin.py) registers through a dynamic wrapper rather

  than a literal @mcp.tool decorator and is only enabled when the admin toolset is turned

  on, so those tools are noted but not enumerated here.'

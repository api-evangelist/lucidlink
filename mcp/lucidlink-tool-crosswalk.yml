source: >-
  mcp/lucidlink-mcp.yml (47 tools read from LucidLink's published lucidlink-mcp 0.3.0
  wheel), openapi/lucidlink-service-api.json (Swagger 2.0, 14 operations), and the
  documented self-hosted Management API surface at
  https://support.lucidlink.com/hc/en-us/articles/40235274774797-API-Key-Functionalities-Common-Automation-Scenarios
description: >-
  LucidLink's MCP surface and its REST surfaces are almost disjoint, and that is the
  headline of this crosswalk rather than a gap in it. The MCP server is a DATA-PLANE tool
  set — it drives the filespace itself (read, write, edit, lock, search, audit) through the
  Python SDK and the LucidLink client daemon, not through any published HTTP API. The
  public Service API (openapi/lucidlink-service-api.json) is a CONTROL-PLANE billing and
  provisioning API. The overlap is a handful of filespace-lifecycle and workspace-admin
  calls. Nothing here is mapped by guesswork: every `rest` value below is either a real
  operationId from the saved Swagger document or a documented Management/Web-Service API
  path, and confidence is set low wherever the binding is semantic rather than proven.
surfaces:
  openapi:
    file: openapi/lucidlink-service-api.json
    base: https://api.lucidlink.com/api/v1
    operations: 14
    gated: false
    note: Specification is public; calling it needs OAuth2 client credentials issued on request.
  management_api:
    base: http://{api-container-host}:3003/api/v1
    spec: not publicly fetchable — Swagger is generated and served by the customer's own container at /api/v1/docs
    gated: true
    note: Endpoint inventory below is taken from LucidLink's published KB reference, not from a spec file.
  web_service_v2:
    base: https://api.lucidlink.com/api/v2
    spec: none published
    gated: true
    note: >-
      Paths read from LucidLink's own lucidlink_mcp/web_service_client.py; probed
      anonymously on 2026-08-25 and answered 401 {"message":"Missing token"}.
  mcp:
    transport: stdio (uvx lucidlink-mcp@latest)
    url: null
    gated: true
    note: No hosted MCP endpoint; a live tools/list requires a service-account token.
  graphql:
    endpoint: null
    note: Probed https://api.lucidlink.com/graphql — 404. No GraphQL surface.

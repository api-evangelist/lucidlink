limit_count: 0
summary: >-
  LucidLink publishes no numeric rate limit for any of its APIs, and takes an explicit
  documented position on why: the administrative API is self-hosted, so there is no
  LucidLink-side gate in front of it. That is an unusual and honest answer rather than a
  silent gap, and it is quoted verbatim below. The practical consequence for an integrator
  is that there is no published budget to plan against and no runtime header to react to.
documented_position:
  quote: >-
    "While there may not be hard external rate limits imposed by the self-hosted container,
    remember that the API calls still interact with your LucidLink backend services. Avoid
    aggressive polling or rapid, unnecessary requests that could create undue load on your
    workspace management systems."
  url: https://support.lucidlink.com/hc/en-us/articles/40222376164365-Best-Practices-Operating-the-LucidLink-API-Container
  companion_guidance: >-
    "Optimize Batch Operations: Where possible, structure your scripts to use batch
    operations rather than issuing many sequential, individual requests."
limits: []

  exhaustion_status: not published
client_side_limiting:
  surface: LucidLink MCP Server
  mechanism: >-
    lucidlink-mcp ships its own in-process rate limiter (lucidlink_mcp/rate_limit.py). Every
    tool call rate-checks before executing, and the cap is set by the `rateLimit` config key
    with a fixed, non-configurable window.
  default_value: not published in the docs; read from the package's DEFAULT_RATE_LIMIT_CALLS constant
  note: >-
    This protects LucidLink's backend from an agent, not the agent from LucidLink. It is the
    only rate-limiting mechanism found anywhere in the LucidLink developer surface.
scaling_guidance:
  url: https://support.lucidlink.com/hc/en-us/articles/43197827829901-Scaling-LucidLink-API-with-Docker-Compose-and-NGINX
  note: >-

    note: >-
      No Retry-After was returned on any anonymous response, but api.lucidlink.com does send
      `access-control-expose-headers: Retry-After` on every response — so the header is
      expected to appear on some (presumably throttled or authenticated) path and is
      deliberately made visible to browser clients. Confirming it would require an

identifier_conventions:
- entity: Filespace
  id: string id; the Management API uses a UUID (example dcb2e737-1bd7-4a81-bf3b-03f6789bb8a6)
- entity: Filesystem entry
  id: colon-delimited internal id, e.g. 103:3 or 4294967294:0 (the filespace root); URL-encoded as 103%3A3
    in paths
- entity: Member / Group
  id: principalId — members and groups share one principal identifier space, which is why permissions
    take a single principalId
- entity: Service account token
  id: 'documented prefix sa_live:'
entities_documented_but_unspecified:
- entity: Member
  api: Management API v1 / Web Service v2
  note: CRUD documented in the KB; no published schema.
- entity: Group
  api: Management API v1 / Web Service v2
  note: CRUD + membership documented; no published schema.
- entity: Permission
  api: Management API v1
  note: Fields path, permissions[], principalId appear in documented request bodies only.
- entity: Entry (file/directory)
  api: Management API v1
  note: parentId, name, type documented in the create-directory example only.
- entity: DirectLink
  api: Management API v1
  note: Generated per entry id or path; no schema published.
- entity: Workspace
  api: Web Service v2
  note: Root of the v2 tree; no schema published.
- entity: DataStore / ExternalFile
  api: LucidLink Connect
  note: Reachable only through the SDK and MCP tools; no HTTP schema published.

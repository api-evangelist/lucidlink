gaps:
- No OAuth2 scopes are declared or documented — a client credential is all-or-nothing across domains, filespaces and billing including setPaymentDetails.
- No RFC 8414 authorization-server metadata and no OIDC discovery document at auth.lucidlink.com (both probed, both 404).
- No 401 or 403 response is declared on any operation in the published Swagger document, although the live API returns 401.
- Standard service accounts carry full workspace-admin authority; least privilege is only available through the Collaborator Service Accounts beta.

  oauth2_flows: [clientCredentials]
  api_keys: false
  mtls: false
  openid_connect: false
  note: >-
    Two distinct models across three APIs. The public Service API uses an OAuth2
    client-credentials grant; the self-hosted Management API and the v2 web service use a
    service-account secret key as a bearer token. There is no user-delegated OAuth flow and

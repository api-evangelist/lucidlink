  sources: [openapi/lucidlink-service-api.json]
- name: service-account-bearer
  api: LucidLink Management API v1 (self-hosted) and Web Service API v2
  type: http
  scheme: bearer
  declared_in: documentation only — no published specification
  request_header: 'Authorization: Bearer <service key>'
  token_prefix: 'sa_live:'
  token_prefix_source: LucidLink's published lucidlink-mcp README
  issuance: >-
    Workspace admins create service accounts in the "Service Accounts" tab of workspace
    settings in the web or desktop app. Available to Business and Enterprise tiers; not
    separately billed.
  rotation: >-
    A service account can hold multiple secret keys, so a new key can be issued and the old
    one retired without interrupting service. `lucid rotate-credentials` (build 3.7.8468)
    rotates the key used by the desktop daemon in place, without remounting the filespace.
  display: Credentials are shown only once, at generation or rotation.
  revocation: Deleting a service account immediately invalidates all of its credentials.
  scope: >-
    IMPORTANT — for the initial release a service account "inherits the full
    permissions/scope of a workspace administrator, granting access to all available API
    functionalities". There is no least-privilege option on a standard service account.
  transport_warning: >-
    The Management API container serves plain HTTP on port 3003. LucidLink's own
    best-practices article requires putting it behind a TLS-terminating reverse proxy so the
    bearer token is never sent in clear text, and restricting the port to trusted internal
    systems.
  sources:
  - https://support.lucidlink.com/hc/en-us/articles/40222074543757-Getting-Started-with-Service-Accounts-API-Authentication
  - https://support.lucidlink.com/hc/en-us/articles/40222376164365-Best-Practices-Operating-the-LucidLink-API-Container

billing_notes:
- Invoices are calculated on average storage used across all filespaces in the workspace over the month.
- Storage is measured decimal (1 TB = 1000 GB).
- Overage is billed at the end of each month when pooled workspace storage exceeds the included allowance.
- Charged per member whether or not data is stored.
- Upgrades take effect immediately with prorated billing; downgrades may require contacting support.
- Taxes/VAT/GST are added at invoicing, not shown in listed prices.
programmatic_billing:
  note: >-
    Billing is also readable through the API — openapi/lucidlink-service-api.json exposes
    getCurrentPeriod, getInvoices, getInvoiceBreakdownPerFilespace, getPaymentDetails and
    setPaymentDetails, with usage broken down per filespace by the dimensions
    ManagedCapacity and FilespaceUsers.
